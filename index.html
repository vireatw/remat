<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接好料 ReMat</title>
<meta name="description" content="工地剩料，就近接手。磁磚、木料、鋼筋、水泥，多出來的材料刊上來，附近需要的人直接來接。">
<meta name="theme-color" content="#FFC21A">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="接好料">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:title" content="接好料 ReMat">
<meta property="og:description" content="工地剩料，就近接手。多出來的材料刊上來，附近需要的人直接來接。">
<meta property="og:url" content="https://remat.tw/">
<meta property="og:image" content="https://remat.tw/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 工地現場：水泥灰底、安全黃標示、黑字。單欄手機 App，底部導覽。 */
  --paper:#EFEEE8;
  --card:#FFFFFF;
  --ink:#1B1C1E;
  --muted:#5E6166;
  --line:#D9D7CE;
  --hazard:#FFC21A;
  --go:#1E7F47;
  --hold:#2C64C4;
  --warn:#D4470E;
  --warn-text:#B33A08; /* 紅橘色的字用深一點，戶外陽光下也看得清楚 */
  --display:"Barlow Condensed","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:96px;background:var(--paper)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--hazard);color:var(--ink);border-bottom:1px solid rgba(27,28,30,.14)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:68px;box-sizing:border-box}
.logo-wrap{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex:none}
.logo-icon{flex:none;display:block}
/* 圖示 44px = 文字區塊 44px（24 + 4 + 16），上下緣對齊 */
.logo{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;height:44px;text-decoration:none;color:var(--ink);min-width:0}
.logo-mark{font-weight:900;font-size:22px;line-height:24px;letter-spacing:.05em;flex:none}
.logo-row{display:flex;align-items:flex-start;gap:8px;height:24px}
/* ReMat 大寫字高 = 「接好料」字高：實測兩者墨色上緣 y=15.25、下緣 y=36，上下都對齊 */
.logo-en{font-family:var(--display);font-weight:800;font-size:29.5px;line-height:24px;letter-spacing:.04em;color:#4A3F12;transform:translateY(-.25px)}
.logo-sub{font-size:13.5px;color:#4A3F12;line-height:16px;white-space:nowrap;align-self:stretch;text-align:justify;text-align-last:justify;text-justify:inter-character}
.loc-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.72);border:1px solid rgba(27,28,30,.16);color:var(--ink);border-radius:999px;height:44px;padding:0 14px;font-size:14px;line-height:1;flex:0 1 auto;min-width:36px;box-sizing:border-box}
.loc-pill svg{color:var(--warn);flex:none}
.loc-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 很窄的手機放不下文字：位置鈕只留圖示，不擠到標題 */
@media (max-width:359px){.loc-pill{width:44px;padding:0;justify-content:center}.loc-pill span{display:none}}

.stats{display:flex;flex-wrap:wrap;gap:4px 16px;padding:10px 16px 0;font-size:13px;color:var(--muted)}
.stats span{white-space:nowrap}
.stats b{color:var(--ink);font-family:var(--display);font-size:17px;margin-right:2px}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 16px 0;background:#E2E0D8;border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:9px 6px;font-weight:700;font-size:15px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg button small{font-weight:500;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.search{margin:12px 16px 0;position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px 11px 40px;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px 4px}
.filters select{border:1.5px solid var(--line);background:var(--card);border-radius:8px;height:40px;padding:0 8px;font-size:14px}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);border:1.5px solid var(--line);background:var(--card);border-radius:8px;height:40px;padding:0 10px;box-sizing:border-box}
.tog input{accent-color:var(--ink);width:16px;height:16px;margin:0}

/* list */
.list{display:grid;gap:10px;padding:10px 16px 16px}
.card{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;width:100%}
.card.done{opacity:.6}
.thumb{width:96px;height:96px;border-radius:8px;overflow:hidden;background:#E6E4DC;position:relative;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.glyph{font-weight:900;font-size:40px;color:#B5B2A6;line-height:1}
.thumb .corner{position:absolute;left:0;bottom:0;width:100%;height:6px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 6px,var(--ink) 6px 12px);opacity:.85}
.c-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cat{font-size:12px;color:var(--muted);font-weight:500}
.pill{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;line-height:1.6}
.p-open{background:#E2F2E8;color:#17663B}
.p-hold{background:#E3ECFB;color:var(--hold)}
.p-done{background:#E6E6E6;color:#555}
.p-hot{background:#FDE7DC;color:var(--warn-text)}
.p-sample{background:var(--hazard);color:var(--ink)}
.card h3{margin:0;font-size:16px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.qty{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty .num{font-size:18px;color:var(--ink);font-weight:700;margin-right:2px}
.c-foot{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:auto}
.price{font-weight:900;font-size:15px;white-space:nowrap;flex:none}
.price.free{color:var(--go)}
/* 收藏愛心：手機版疊在縮圖右上角（卡片邊框 1 + padding 10，距縮圖上緣、右緣各 4px）；看起來 36px，可按範圍 44px */
.cwrap{position:relative;display:grid}
.fav::after{content:"";position:absolute;inset:-4px}
.fav{position:absolute;top:15px;left:67px;width:36px;height:36px;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 1px 3px rgba(0,0,0,.2);color:var(--ink);display:grid;place-items:center}
.fav svg,.d-fav svg{fill:none;stroke:currentColor;display:block}
.fav[aria-pressed="true"],.d-fav[aria-pressed="true"]{color:var(--warn)}
.fav[aria-pressed="true"] svg,.d-fav[aria-pressed="true"] svg{fill:currentColor}
.where{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}

.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{margin:12px 16px 0;background:#FFF6D6;border:1px solid #F0D27A;border-radius:10px;padding:10px 12px;font-size:13.5px}
.notice.err{background:#FDE7DC;border-color:#F2B79A}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;align-items:end;padding:6px 8px 8px}
.nav-btn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px}
.nav-btn[aria-current="page"]{color:var(--ink);font-weight:700}
.nav-post{color:var(--ink);font-weight:700}
.nav-post-ico{width:48px;height:40px;border-radius:12px;background:var(--hazard);display:grid;place-items:center;box-shadow:0 2px 0 var(--ink);margin-top:-14px;margin-bottom:2px}
.post-btn{border:0;background:var(--hazard);color:var(--ink);font-weight:900;font-size:16px;border-radius:12px;padding:12px 20px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 0 var(--ink)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(20,20,22,.45)}
.sheet.open{display:block}
.panel{position:absolute;inset:0;max-width:520px;margin:0 auto;background:var(--paper);display:flex;flex-direction:column}
.panel-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:#ECEAE3;border-radius:10px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.panel-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel-foot{background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.yellow{background:var(--hazard);border-color:var(--ink)}
.btn.danger{border-color:var(--warn-text);color:var(--warn-text)}
.btn.grow{flex:1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:0 14px;min-height:40px;font-size:14px;border-radius:8px}

/* detail */
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#DCDAD1;aspect-ratio:4/3}
.gallery>*{flex:none;width:100%;height:100%;scroll-snap-align:start;display:grid;place-items:center}
.gallery img{width:100%;height:100%;object-fit:contain;background:#1B1C1E}
.gallery .glyph{font-size:96px}
/* 沒照片：只放一條矮的分類色帶，不要佔掉半個畫面 */
.gallery.nophoto{aspect-ratio:auto;height:120px;position:relative}
.gallery.nophoto .glyph{font-size:56px}
.gallery.nophoto::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 8px,var(--ink) 8px 16px);opacity:.85}
.g-count{position:relative}
.g-badge{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;border-radius:999px;padding:2px 9px}
.d-sec{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:grid;gap:8px}
.d-title{margin:0;font-size:20px;font-weight:900;line-height:1.3;text-wrap:balance}
.d-big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.box .lbl{font-size:12px;color:var(--muted)}
.box .val{font-size:15px;font-weight:700}
.box .val .num{font-size:26px;line-height:1.1}
.kv{margin:0;display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.desc{white-space:pre-wrap;margin:0;font-size:15px;max-width:65ch}
.sec-h{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0}
.contact-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.contact-row .v{font-family:var(--display);font-size:22px;font-weight:700;margin-right:auto;font-variant-numeric:tabular-nums}
.statusbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.statusbar button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 4px;font-weight:700;font-size:14px}
.statusbar button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.match{display:grid;gap:8px}
.match .card{grid-template-columns:64px 1fr}
.match .thumb{width:64px;height:64px}
.match .glyph{font-size:26px}

/* form */
.form{padding:14px 16px 24px;display:grid;gap:16px}
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font-weight:700;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted);font-weight:400}
.req{color:var(--warn);margin-left:2px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;font-size:16px}
input.inp,select.inp{height:48px;padding-top:0;padding-bottom:0}
textarea.inp{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row-qty{display:grid;grid-template-columns:1fr 120px;gap:8px}
.price-inp{position:relative;display:flex;align-items:center}
.price-inp[hidden]{display:none}
.price-inp .pre,.price-inp .suf{position:absolute;color:var(--muted);font-size:15px;pointer-events:none}
.price-inp .pre{left:12px;font-weight:700;color:var(--ink)}
.price-inp .suf{right:12px}
.price-inp .inp{padding-left:28px;padding-right:72px}
.more{grid-column:1/-1;justify-self:center;min-width:220px;margin-top:4px}
.empty .btn{margin-top:12px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hint-p{margin:0;color:var(--muted);font-size:14px}
.btn.geo{justify-content:flex-start;gap:8px}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:inline-flex;align-items:center;min-height:42px;box-sizing:border-box;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:0 13px;font-size:14.5px;font-weight:500}
.radios input:checked+span{border-color:var(--ink);background:var(--ink);color:#fff}
.radios input:focus-visible+span{outline:3px solid var(--hold);outline-offset:2px}
.kind-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind-pick label{position:relative}
.kind-pick input{position:absolute;opacity:0}
.kind-pick label{display:grid}
.kind-pick span{display:block;height:100%;box-sizing:border-box;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.kind-pick span b{display:block;font-size:17px}
.kind-pick span small{color:var(--muted);font-size:12.5px}
.kind-pick input:checked+span{border-color:var(--ink);box-shadow:inset 0 -5px 0 var(--hazard)}
.kind-pick input:focus-visible+span{outline:3px solid var(--hold);outline-offset:2px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos .ph{aspect-ratio:1;border-radius:8px;overflow:hidden;background:#E6E4DC;position:relative}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:999px;width:24px;height:24px;font-size:14px;line-height:1}
.photos .add{aspect-ratio:1;border:1.5px dashed #8A877A;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;background:var(--card);cursor:pointer}
.photos .add.big{grid-column:span 2;aspect-ratio:2/1;font-size:15px;font-weight:700;color:var(--ink);gap:2px;align-content:center}
.photos .add.big svg{display:block;margin:0 auto}
.check{display:flex;align-items:center;gap:8px;font-size:14.5px}
.check input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.err-msg{color:var(--warn-text);font-size:13px;font-weight:500}
.err-msg:empty{display:none}
.inp[aria-invalid="true"]{border-color:var(--warn-text);background:#FFF8F5}
.radios[aria-invalid="true"] span{border-color:var(--warn-text)}

/* me */
.me{padding:14px 16px;display:grid;gap:14px}
.me h2{margin:0;font-size:18px}
.panelcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mini-stats b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.mini-stats span{font-size:12px;color:var(--muted)}

.county-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.county-grid button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:9px 4px;font-size:15px}
.county-grid button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90%;display:none}
.toast.show{display:block}
.dialog{position:fixed;inset:0;z-index:30;background:rgba(20,20,22,.5);display:none;place-items:center;padding:24px}
.dialog.open{display:grid}
.dialog-box{background:var(--card);border-radius:14px;padding:18px;max-width:360px;width:100%;display:grid;gap:12px}
.dialog-box p{margin:0}
.dialog-box .acts{display:flex;gap:8px;justify-content:flex-end}

/* chat */
.nav-btn{position:relative}
.badge[hidden]{display:none}
.badge{position:absolute;top:0;left:calc(50% + 4px);background:var(--warn);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;line-height:1}
.threads{display:grid;border-top:1px solid var(--line)}
.thread{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--card);border:0;border-bottom:1px solid var(--line);padding:12px 16px;text-align:left;width:100%}
.thread .thumb,.chat-item .thumb{width:52px;height:52px}
.thread .glyph,.chat-item .glyph{font-size:24px}
.t-min{min-width:0;display:grid;gap:1px}
.t-name{font-weight:700;font-size:15px}
.t-item,.t-last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-last{font-size:14px}
.thread.unread .t-last{color:var(--ink);font-weight:700}
.t-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn)}
.chat-item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 16px;background:var(--card);border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.chat-item .go{font-size:13px;color:var(--hold);font-weight:700}
.msgs{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;min-height:100%}
.day{align-self:center;font-size:12px;color:var(--muted);background:#E2E0D8;border-radius:999px;padding:2px 10px;margin:8px 0}
.bub{max-width:78%;padding:8px 12px;border-radius:14px;font-size:15px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.bub.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.mine{align-self:flex-end;background:var(--hazard);border-bottom-right-radius:4px}
.bub time{display:block;font-size:11px;color:var(--muted);margin-top:2px;text-align:right;font-variant-numeric:tabular-nums}
.bub.mine time{color:#6B5300}
.chat-empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;padding:24px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 0;background:var(--card);border-top:1px solid var(--line);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.composer{display:flex;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:var(--card)}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;font-size:16px;background:var(--paper)}
.send{border:0;background:var(--ink);color:#fff;border-radius:999px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5}
.privacy{font-size:12.5px;color:var(--muted);margin:0}

.lg-why{margin:0;font-size:14.5px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{border:0;background:none;color:var(--hold);font-weight:500;font-size:14px;padding:12px 0;margin:-12px 0;justify-self:start}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acct .email{font-weight:700;word-break:break-all;margin-right:auto}

.about-lead{margin:0;font-size:16px;line-height:1.7;max-width:65ch}
.about-steps{margin:0;padding-left:22px;display:grid;gap:10px;font-size:15px;line-height:1.6}
.about-steps b{display:block}
.about-list{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px;line-height:1.6}
.about-warn{border-color:#F2B79A;background:#FFF4EE}
.about-meta{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 8px}

.skel{height:118px;border-radius:12px;background:linear-gradient(90deg,#E4E2DA,#ECEAE3,#E4E2DA);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* ---------- 版面：手機（預設）／平板 iPad ≥768px／電腦 ≥1100px ---------- */
.topnav{display:none}
.panel-body{min-height:0}
@media (min-width:768px){
  .app{max-width:none;padding-bottom:40px}
  .nav{display:none}
  .top-in{max-width:1280px;margin:0 auto;padding:12px 24px;gap:16px}
  .topnav{display:flex;align-items:center;gap:4px;margin-left:auto}
  .tn{position:relative;border:0;background:transparent;border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px}
  .tn:hover{background:rgba(27,28,30,.07)}
  .tn[aria-current="page"]{background:rgba(27,28,30,.12)}
  .tn .badge{position:static}
  .topnav .post-btn{margin-left:6px;padding:9px 18px;font-size:15px;background:var(--ink);color:#fff;box-shadow:none}
  .loc-pill{margin-left:0;max-width:220px}
  #browseView,#meView,#chatsView,#aboutView{max-width:1280px;margin:0 auto;padding:0 8px}
  .chips{flex-wrap:wrap;overflow:visible}
  #list,#meList,#meFavs{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  #list .card,#meList .card,#meFavs .card{grid-template-columns:1fr;padding:0;gap:0;overflow:hidden;align-content:start;transition:box-shadow .15s}
  #list .card:hover,#meList .card:hover,#meFavs .card:hover{box-shadow:0 4px 18px rgba(0,0,0,.08)}
  #list .thumb,#meList .thumb,#meFavs .thumb{width:100%;height:auto;aspect-ratio:4/3;border-radius:0}
  #list .glyph,#meList .glyph,#meFavs .glyph{font-size:64px}
  #list .c-body,#meList .c-body,#meFavs .c-body{padding:12px 14px 14px;gap:4px}
  .list .empty{grid-column:1/-1}
  .list .skel{height:300px}
  #list .fav,#meList .fav,#meFavs .fav{left:auto;right:8px;top:8px;width:36px;height:36px}
  /* 我的／訊息／關於：左緣對齊標題列，表單不要拉太寬 */
  .me{max-width:none;margin:0;padding:24px 16px}
  .me>.panelcard,.me>.mini-stats,.me>.about-lead,.me>.privacy{max-width:720px}
  #chatsView .threads{max-width:720px}
  .threads{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 16px}
  .sheet .panel{inset:auto;top:4vh;bottom:4vh;left:50%;transform:translateX(-50%);width:min(680px,92vw);max-width:none;margin:0;border-radius:16px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.35)}
  #locSheet .panel,#loginSheet .panel{top:8vh;bottom:auto;max-height:84vh}
  /* 詳情視窗高度跟著內容，不要下面一大片空白；沒照片時不放大方塊 */
  #detailSheet .panel{bottom:auto;max-height:92vh}
  .sheet .gallery{max-height:42vh}
  .toast{bottom:32px}
}
@media (min-width:1100px){
  .browse-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;align-items:start}
  .side .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .side .chip{padding:0 6px}
  .side{position:sticky;top:76px;padding-bottom:16px}
  .side .filters{flex-direction:column;align-items:stretch}
  .side .filters select,.side .tog{width:100%}
  #list{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));padding-top:12px;padding-left:8px}
  #detailSheet .panel{width:min(1040px,94vw)}
  #detailSheet .panel-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  #dPhotos{position:sticky;top:0}
  #dPhotos .gallery{aspect-ratio:1/1;max-height:none}
  #dPhotos .gallery.nophoto{aspect-ratio:auto;height:160px}
}
</style>

const PAGE=60;

/* ---------- helpers ---------- */
// 找刊登：首頁載入的、我的刊登、或另外抓來的（收藏、分享連結）
function getL(id){return S.listings.find(x=>x.id===id)||(S.mine||[]).find(x=>x.id===id)||S.extra[id]||null;}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeImg=s=>(typeof s==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(s))?s:"";
const fmtN=n=>{const x=Number(n);return isFinite(x)?x.toLocaleString("zh-TW"):"";};
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600);}
function confirmBox(text){return new Promise(res=>{const d=$("#dialog");$("#dlgText").textContent=text;d.classList.add("open");
  const done=v=>{d.classList.remove("open");$("#dlgYes").onclick=null;$("#dlgNo").onclick=null;res(v);};
  $("#dlgYes").onclick=()=>done(true);$("#dlgNo").onclick=()=>done(false);$("#dlgYes").focus();});}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function timeAgo(ms){if(!ms)return"";const s=(Date.now()-ms)/1000;if(s<60)return"剛剛";if(s<3600)return Math.floor(s/60)+" 分鐘前";if(s<86400)return Math.floor(s/3600)+" 小時前";if(s<86400*7)return Math.floor(s/86400)+" 天前";const d=new Date(ms);return (d.getMonth()+1)+"/"+d.getDate();}
function daysLeft(dstr){if(!dstr||!/^\d{4}-\d{2}-\d{2}$/.test(dstr))return null;const [y,m,d]=dstr.split("-").map(Number);const t=new Date(y,m-1,d);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000);}
function mdText(dstr){if(!dstr)return"";const p=dstr.split("-");return Number(p[1])+"/"+Number(p[2]);}
function km(a,b){const R=6371,toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function distScore(l){
  if(!S.me.county||!CMAP[l.county])return 9999;
  if(l.county===S.me.county){return (S.me.area&&l.area&&String(l.area).indexOf(S.me.area.replace(/區|鄉|鎮|市$/,""))===0)?0:1;}
  return 2+km(CMAP[S.me.county],CMAP[l.county]);
}
function distLabel(l){
  if(!S.me.county)return"";
  if(l.county===S.me.county){return distScore(l)===0?"同區":"同縣市";}
  if(CMAP[l.county]&&CMAP[S.me.county])return"直線約 "+Math.round(km(CMAP[S.me.county],CMAP[l.county]))+" km";
  return"";
}
function priceHTML(l){
  const want=l.kind==="want";const u=l.unit||"";
  switch(l.priceMode){
    case"free":return '<span class="price free">'+(want?"希望免費":"免費送")+'</span>';
    case"lot":return '<span class="price">'+(want?"預算 ":"整批 ")+'$<span class="num">'+fmtN(l.price)+'</span></span>';
    case"unit":return '<span class="price">'+(want?"預算 ":"")+'$<span class="num">'+fmtN(l.price)+'</span> / '+esc(u)+'</span>';
    default:return '<span class="price">'+(want?"預算可議":"價格可議")+'</span>';
  }
}
function urgencyPill(l){
  if(l.status==="done")return"";const d=daysLeft(l.deadline);if(d===null)return"";

}

/* ---------- filtering ---------- */
function visible(){
  const q=S.q.trim().toLowerCase();
  let arr=S.listings.filter(l=>l&&l.title&&(l.kind||"offer")===S.kind);
  if(S.cat!=="all")arr=arr.filter(l=>l.cat===S.cat);
  if(!S.showDone)arr=arr.filter(l=>l.status!=="done");
  if(S.freeOnly)arr=arr.filter(l=>l.priceMode==="free");
  if(q){const parts=q.split(/\s+/);arr=arr.filter(l=>{const h=[l.title,l.spec,l.desc,l.county,l.area,(CATMAP[l.cat]||{}).name].join(" ").toLowerCase().replace(/[x×*]/g,"x");return parts.every(p=>h.indexOf(p.replace(/[x×*]/g,"x"))>=0);});}
  if(S.sort==="near"&&S.me.county)arr.sort((a,b)=>distScore(a)-distScore(b)||(b.createdAt||0)-(a.createdAt||0));
  else if(S.sort==="due")arr.sort((a,b)=>{const da=daysLeft(a.deadline),db=daysLeft(b.deadline);return (da===null?1e9:da<0?1e8:da)-(db===null?1e9:db<0?1e8:db);});
  else arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return arr;
}

function combine(){

  if(S.moreLoading||!S.db)return;const last=S.listings[S.listings.length-1];if(!last)return;

    const snap=await S.db.collection("listings").orderBy("createdAt","desc").startAfter(last.createdAt||0).limit(PAGE).get();

/* ---------- writes ---------- */
async function write(fn){
  if(!S.db){toast("沒有連上資料庫，現在不能儲存");return false;}
  if(navigator.onLine===false){toast("沒有網路，連上網路後再試一次");return false;}
  const slow=setTimeout(()=>toast("網路比較慢，還在儲存，請不要關掉…"),8000);
  try{return await writeTry(fn);}finally{clearTimeout(slow);}
}
async function writeTry(fn){
  for(let attempt=0;attempt<2;attempt++){
    try{await fn();return true;}
    catch(e){
      const code=e&&e.code;
      if(code==="unavailable"&&attempt===0){await new Promise(r=>setTimeout(r,500+Math.random()*700));continue;}
      if(code==="permission_denied"){toast(S.uid?"沒有權限做這件事":"請先登入");if(!S.uid)openLogin("請先登入。");}
      else if(code==="invalid_argument")toast("資料格式不對，或照片太大，請換一張再試");
      else if(code==="quota_exceeded")toast("資料庫空間滿了，請刪掉一些舊刊登");
      else if(code==="resource_exhausted")toast("操作太頻繁，請稍等一下再試");
      else toast("儲存失敗，請稍後再試");
      return false;
    }
  }
  return false;
}

  }
}

/* ---------- image compression ---------- */
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("bad"));};im.src=u;});}
function draw(im,max,q){const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.round(im.naturalWidth*r),h=Math.round(im.naturalHeight*r);const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);return cv.toDataURL("image/jpeg",q);}
async function compress(file){
  const im=await loadImage(file);
  let max=1280,q=.72,full=draw(im,max,q);
  while(full.length>200000&&(q>.4||max>640)){if(q>.45)q-=.1;else max=Math.round(max*.8);full=draw(im,max,q);}
  let thumb=draw(im,280,.55);if(thumb.length>26000)thumb=draw(im,220,.5);
  return {full,thumb};
}

   '<div class="field"><span class="lbl">地點<span class="req">*</span> <span class="hint">寫到區或路段就好，不用門牌</span></span><div class="row2"><select class="inp" id="fCounty" aria-label="縣市"><option value="">選縣市</option>'+COUNTIES.map(c=>'<option'+(c[0]===l.county?" selected":"")+'>'+c[0]+'</option>').join("")+'</select><input class="inp" id="fArea" maxlength="30" value="'+esc(l.area)+'" placeholder="例：西屯區" aria-label="鄉鎮區"></div></div>'+
   '<div class="field"><label for="fDeadline" id="fDeadlineLbl">最晚清場日</label><input class="inp" type="date" id="fDeadline" value="'+esc(l.deadline)+'"></div>'+
   '<div class="field"><span class="lbl" id="fPickLbl">交貨方式</span><div class="radios">'+Object.keys(PICKUP).map(k=>'<label><input type="checkbox" name="pickup" value="'+k+'"'+((l.pickup||[]).indexOf(k)>=0?" checked":"")+'><span>'+PICKUP[k]+'</span></label>').join("")+'</div></div>'+
   '<div class="field"><span class="lbl">照片 <span class="hint">最多 4 張，第一張當封面</span></span><div class="photos" id="fPhotos"></div><input type="file" id="fFile" accept="image/*" multiple hidden></div>'+
   '<div class="field"><span class="lbl">聯絡方式<span class="req">*</span> <span class="hint">電話或 LINE 至少填一個</span></span>'+
    '<input class="inp" id="fName" maxlength="30" value="'+esc(l.contactName)+'" placeholder="聯絡人／公司" aria-label="聯絡人">'+
    '<div class="row2"><input class="inp" id="fPhone" inputmode="tel" maxlength="20" value="'+esc(l.phone)+'" placeholder="電話" aria-label="電話"><input class="inp" id="fLine" maxlength="30" value="'+esc(l.line)+'" placeholder="LINE ID" aria-label="LINE ID"></div>'+
    '<label class="check"><input type="checkbox" id="fRemember" checked> 記住我的聯絡方式和位置</label></div>'+
   '<div class="err-msg" id="fErr" role="alert"></div>';
  const pm=f.querySelector('input[name="pm"][value="'+(l.priceMode||"free")+'"]');if(pm)pm.checked=true;
  syncForm();renderPhotos();
  openSheet("#postSheet");$("#postSheet .panel-body").scrollTop=0;
}
function syncForm(){
  const f=$("#postForm");const kind=(f.querySelector('input[name="kind"]:checked')||{}).value;
  const pm=(f.querySelector('input[name="pm"]:checked')||{}).value;
  const want=kind==="want";
  $("#fDeadlineLbl").textContent=want?"什麼時候需要":"最晚清場日";
  $("#fPickLbl").textContent=want?"可以怎麼取貨":"交貨方式";
  const pr=$("#fPrice");$("#fPriceBox").hidden=!(pm==="lot"||pm==="unit");
  pr.placeholder=pm==="unit"?"每單位多少錢":"整批多少錢";
  $("#fPriceSuf").textContent=pm==="unit"?"/ "+$("#fUnit").value:"整批";
}
function renderPhotos(){
  const box=$("#fPhotos");if(!box)return;
  let h="";
  if(S.newPhotos){h=S.newPhotos.map((p,i)=>'<div class="ph"><img alt="照片 '+(i+1)+'" src="'+esc(p.thumb)+'"><button type="button" data-rmph="'+i+'" aria-label="移除照片">×</button></div>').join("");}
  else if(S.keepPhotoCount){const l=getL(S.editId);const th=l&&safeImg(l.thumb);h='<div class="ph">'+(th?'<img alt="目前封面" src="'+esc(th)+'">':'')+'</div><div class="add" style="cursor:default;border-style:solid">已有 '+S.keepPhotoCount+' 張<br>重選會取代</div>';}
  const count=S.newPhotos?S.newPhotos.length:0;
  const empty=!count&&!S.keepPhotoCount;
  if(count<4)h+=empty?'<label class="add big" for="fFile"><span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照／選照片</span></label>':'<label class="add" for="fFile">＋<br>加照片</label>';
  box.innerHTML=h;
}
$("#postForm").addEventListener("change",async e=>{
  if(e.target.name==="kind"||e.target.name==="pm"||e.target.id==="fUnit")syncForm();
  if(e.target.id==="fFile"){
    const files=[...e.target.files].slice(0,4-(S.newPhotos?S.newPhotos.length:0));e.target.value="";
    if(!files.length)return;
    toast("處理照片中…");
    const out=S.newPhotos?S.newPhotos.slice():[];
    for(const file of files){try{out.push(await compress(file));}catch(err){toast("有一張照片讀不了，請換一張");}}
    S.newPhotos=out.slice(0,4);renderPhotos();
  }
});
$("#postForm").addEventListener("input",e=>{const t=e.target;if(t.getAttribute&&t.getAttribute("aria-invalid"))t.removeAttribute("aria-invalid");if(t.name==="cat")$("#fCats").removeAttribute("aria-invalid");});
$("#postForm").addEventListener("click",e=>{const b=e.target.closest("[data-rmph]");if(b){S.newPhotos.splice(Number(b.getAttribute("data-rmph")),1);renderPhotos();}});
$("#postForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const f=$("#postForm");const val=id=>$(id).value.trim();
  const kind=(f.querySelector('input[name="kind"]:checked')||{}).value||"offer";
  const cat=(f.querySelector('input[name="cat"]:checked')||{}).value||"";
  const pm=(f.querySelector('input[name="pm"]:checked')||{}).value||"free";
  const qty=Number(val("#fQty").replace(/,/g,""));
  const price=Number(val("#fPrice").replace(/[,$]/g,""));
  const pickup=[...f.querySelectorAll('input[name="pickup"]:checked')].map(i=>i.value);
  const data={kind,cat,title:val("#fTitle"),qty,unit:$("#fUnit").value,spec:val("#fSpec"),desc:val("#fDesc"),priceMode:pm,price:(pm==="lot"||pm==="unit")?price:0,
    county:$("#fCounty").value,area:val("#fArea"),deadline:$("#fDeadline").value||"",pickup,contactName:val("#fName"),phone:val("#fPhone"),line:val("#fLine")};
  const errs=[],bad=[];
  const need=(ok,msg,el)=>{if(!ok){errs.push(msg);bad.push(el);}};
  need(cat,"選一個分類","#fCats");need(data.title,"填品名","#fTitle");need(qty>0,"填數量","#fQty");
  need(!(pm==="lot"||pm==="unit")||(price>=0&&val("#fPrice")),"填金額","#fPrice");
  need(data.county,"選縣市","#fCounty");need(data.phone||data.line,"留電話或 LINE","#fPhone");
  f.querySelectorAll('[aria-invalid="true"]').forEach(x=>x.removeAttribute("aria-invalid"));
  if(errs.length){
    bad.forEach(sel=>{$(sel).setAttribute("aria-invalid","true");if(sel==="#fPhone")$("#fLine").setAttribute("aria-invalid","true");});
    $("#fErr").textContent="還差：" + errs.join("、");
    const first=$(bad[0]);first.scrollIntoView({block:"center"});if(first.focus&&first.tagName!=="DIV")first.focus({preventScroll:true});
    return;
  }
  $("#fErr").textContent="";
  const btn=$("#postSubmit");btn.disabled=true;btn.textContent="上傳中…";
  const editing=!!S.editId;
  // 新刊登重試時沿用同一個編號和時間，不會變成兩筆
  if(!editing&&!S.pending)S.pending={id:S.db.collection("listings").doc().id,createdAt:Date.now()};
  const id=editing?S.editId:S.pending.id;const ref=S.db.doc("listings/"+id);
  const old=editing?getL(id):null;const photos=S.newPhotos?S.newPhotos.slice():null;const uid=S.uid;
  const ok=await write(async()=>{
    const oldCount=old?(old.photoCount||0):0;
    let photoCount=oldCount,thumb=old?(old.thumb||""):"";
    if(photos){photoCount=photos.length;thumb=photos[0]?photos[0].thumb:"";}
    const now=Date.now();
    const body=Object.assign({},data,{photoCount,thumb,updatedAt:now,ownerId:old?old.ownerId:uid,status:old?(old.status||"open"):"open",createdAt:old?(old.createdAt||now):S.pending.createdAt,sample:old?!!old.sample:false});
    // 先存刊登，再存照片（規則要求照片只能放在自己的刊登底下）
    await ref.set(body);
    if(photos){
      await Promise.all(photos.map((ph,i)=>S.db.doc("photos/"+id+"-"+i).set({img:ph.full,listingId:id,ownerId:uid})));
      for(let i=photos.length;i<oldCount;i++){try{await S.db.doc("photos/"+id+"-"+i).delete();}catch(e){}}
    }
  });
  btn.disabled=false;btn.textContent=editing?"儲存修改":"刊登";
  if(!ok)return;
  S.pending=null;
  if($("#fRemember").checked){Object.assign(S.me,{name:data.contactName,phone:data.phone,line:data.line,county:data.county,area:data.area});saveProfile(true);}
  closeSheet("#postSheet");
  if(!editing){S.kind=kind;S.cat="all";S.q="";$("#q").value="";setView("browse");}
  toast(editing?"已更新":"刊登成功！");
  if(editing&&S.openId===id)openDetail(id);
});

/* ---------- profile ---------- */
// users/{uid}：聯絡資料用 merge 寫入，不會蓋掉收藏
async function saveProfile(silent){
  lsSet("jieliao.me",S.me);renderTop();
  if(S.db&&S.uid){
    const pr={};["name","phone","line","county","area"].forEach(k=>pr[k]=String(S.me[k]||""));
    try{await S.db.doc("users/"+S.uid).set(pr,{merge:true});}
    catch(e){toast("聯絡資料沒有存到，請檢查網路再試一次");return false;}
  }
  if(!silent)toast("已儲存");return true;
}
function openLoc(){
  const g=$("#countyGrid");S._pickCounty=S.me.county;
  g.innerHTML=COUNTIES.map(c=>'<button type="button" data-c="'+c[0]+'" aria-pressed="'+(c[0]===S.me.county)+'">'+c[0]+'</button>').join("");
  $("#locArea").value=S.me.area||"";openSheet("#locSheet");
}
$("#countyGrid").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;S._pickCounty=b.getAttribute("data-c");$("#countyGrid").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
// 用手機定位找最近的縣市（只算縣市，不會存精確位置）
$("#locGeo").addEventListener("click",()=>{
  if(!navigator.geolocation){toast("這個瀏覽器不能定位，請直接選縣市");return;}
  const b=$("#locGeo");b.disabled=true;
  navigator.geolocation.getCurrentPosition(pos=>{
    b.disabled=false;const here={lat:pos.coords.latitude,lng:pos.coords.longitude};
    let best=null,bd=1e9;COUNTIES.forEach(c=>{const d=km(here,CMAP[c[0]]);if(d<bd){bd=d;best=c[0];}});
    if(!best||bd>120){toast("你好像不在台灣，請直接選縣市");return;}
    S._pickCounty=best;$("#countyGrid").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.getAttribute("data-c")===best));
    toast("找到了：" + best + "，再填鄉鎮區更準");$("#locArea").focus();
  },()=>{b.disabled=false;toast("沒辦法定位，請到設定允許定位，或直接選縣市");},{timeout:10000,maximumAge:600000});
});
$("#locSave").addEventListener("click",()=>{if(!S._pickCounty){toast("先選一個縣市");return;}S.me.county=S._pickCounty;S.me.area=$("#locArea").value.trim();closeSheet("#locSheet");saveProfile(true);toast("位置已更新");render();});

/* ---------- favorites ---------- */
// 沒登入：存在這台裝置（jieliao.favs）。登入後：存在帳號裡，每次只加或減一筆，不會蓋掉別台裝置的收藏
function toggleFav(id){
  const i=S.favs.indexOf(id);
  if(i<0&&S.favs.length>=300){toast("收藏最多 300 筆，先取消一些舊的");return;}
  if(i>=0)S.favs.splice(i,1);else S.favs.unshift(id);
  if(!S.uid)lsSet("jieliao.favs",S.favs);
  else if(S.db)S.db.doc("users/"+S.uid).set({favs:i>=0?S.B.arrayRemove(id):S.B.arrayUnion(id)},{merge:true}).catch(()=>toast("收藏沒有存到，請檢查網路"));
  toast(i>=0?"已取消收藏":"已收藏，在「我的」找得到");
  render();
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-post]")){openPost(null);return;}
  if(e.target.closest("[data-clear]")){S.q="";S.cat="all";S.freeOnly=false;$("#q").value="";$("#freeOnly").checked=false;render();return;}
});
document.addEventListener("click",e=>{const b=e.target.closest("[data-fav]");if(b){e.preventDefault();toggleFav(b.getAttribute("data-fav"));}});
$("#dFav").addEventListener("click",()=>{if(S.openId)toggleFav(S.openId);});

/* ---------- events ---------- */
$("#kindOffer").onclick=()=>{S.kind="offer";render();};
$("#kindWant").onclick=()=>{S.kind="want";render();};
$("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b){S.cat=b.getAttribute("data-cat");render();}});
let qT;$("#q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value;renderList();},150);});
$("#sort").addEventListener("change",e=>{S.sort=e.target.value;if(S.sort==="near"&&!S.me.county){toast("先設定你的工地位置");openLoc();}renderList();});
$("#freeOnly").addEventListener("change",e=>{S.freeOnly=e.target.checked;renderList();});
$("#showDone").addEventListener("change",e=>{S.showDone=e.target.checked;renderList();});
$("#list").addEventListener("click",e=>{if(e.target.closest("[data-more]")){loadMore();return;}const b=e.target.closest("[data-open]");if(b)openDetail(b.getAttribute("data-open"));});
$("#meView").addEventListener("click",e=>{
  const b=e.target.closest("[data-open]");if(b){openDetail(b.getAttribute("data-open"));return;}
  if(e.target.closest("#meLoc")){openLoc();return;}
  if(e.target.closest("#meSave")){S.me.name=$("#meName").value.trim();S.me.phone=$("#mePhone").value.trim();S.me.line=$("#meLine").value.trim();saveProfile(false);}
});
$("#locBtn").onclick=openLoc;
$("#logoLink").onclick=e=>{e.preventDefault();setView("browse");};
$("#navBrowse").onclick=()=>setView("browse");
$("#navMe").onclick=()=>setView("me");
$("#navChats").onclick=()=>setView("chats");
$("#navAbout").onclick=()=>setView("about");
document.querySelectorAll("[data-tview]").forEach(b=>b.onclick=()=>setView(b.getAttribute("data-tview")));
$("#tnPost").onclick=()=>openPost(null);
document.querySelector('[data-tview="browse"]').setAttribute("aria-current","page");
$("#navPost").onclick=()=>openPost(null);

/* ---------- boot ---------- */
const saved=lsGet("jieliao.me");if(saved&&typeof saved==="object")Object.assign(S.me,saved);
function guestFavs(){const v=lsGet("jieliao.favs");return Array.isArray(v)?v.filter(x=>typeof x==="string").slice(0,300):[];}
S.favs=guestFavs();
render();

/* ---------- login ---------- */
const iosStandalone=!!window.navigator.standalone;
function openLogin(why,after){
  if(!S.B){toast(S.loadErr||"還在連線，請稍等一下");return;}
  S._afterLogin=after||null;
  $("#lgWhy").textContent=why||"登入後就能刊登和傳訊息。只是看材料不用登入。";
  $("#lgErr").textContent="";
  $("#lgGoogle").hidden=iosStandalone;$("#lgGoogleNote").hidden=!iosStandalone;
  openSheet("#loginSheet");
}
async function doAuth(fn){
  const btns=document.querySelectorAll("#lgForm button");btns.forEach(b=>b.disabled=true);$("#lgErr").textContent="";
  try{await fn();}catch(e){$("#lgErr").textContent=(e&&e.message)||"登入失敗，請再試一次";}
  btns.forEach(b=>b.disabled=false);
}
const lgVals=()=>({email:$("#lgEmail").value.trim(),pw:$("#lgPw").value});
$("#lgGoogle").onclick=()=>doAuth(()=>S.B.google());
$("#lgForm").addEventListener("submit",e=>{e.preventDefault();const v=lgVals();if(!v.email||!v.pw){$("#lgErr").textContent="請填 Email 和密碼";return;}doAuth(()=>S.B.emailIn(v.email,v.pw));});
$("#lgUp").onclick=()=>{const v=lgVals();if(!v.email||v.pw.length<6){$("#lgErr").textContent="請填 Email，密碼至少 6 個字";return;}doAuth(()=>S.B.emailUp(v.email,v.pw));};
$("#lgReset").onclick=()=>{const v=lgVals();if(!v.email){$("#lgErr").textContent="先在上面填你的 Email，再按忘記密碼";return;}doAuth(async()=>{await S.B.reset(v.email);toast("重設密碼的信已寄到 "+v.email);});};
document.addEventListener("click",e=>{
  if(e.target.closest("[data-login]")){openLogin();return;}
  if(e.target.closest("#meLogout")){confirmBox("確定要登出嗎？").then(ok=>{if(ok&&S.B)S.B.signOut().then(()=>toast("已登出"));});}
});

function waitBackend(){
  return new Promise(res=>{
    if(window.RematBackend)return res(window.RematBackend);
    window.addEventListener("remat-backend",()=>res(window.RematBackend),{once:true});
    setTimeout(()=>res(window.RematBackend||null),15000);
  });
}

(async function boot(){
  const B=await waitBackend();
  if(!B||B.error){
    S.loading=false;
    S.loadErr=(B&&B.error==="config")?"網站還沒設定 Firebase：請照上線教學把設定貼進 config.js。":"連不上資料庫，請檢查網路後重新整理頁面。";
    render();return;
  }
  S.B=B;S.db=B.db;
  const timer=setTimeout(()=>{S.stale=true;S.loading=false;render();},10000);
  S.db.collection("listings").orderBy("createdAt","desc").limit(PAGE).onSnapshot(snap=>{
    S.page1=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(!S.pages.length)S.lastPageFull=snap.docs.length===PAGE;
    combine();S.loading=false;
    if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false;}
    render();
  },err=>{
    clearTimeout(timer);S.loading=false;
    S.loadErr=(err&&err.code==="permission_denied")?"資料庫規則還沒設定好：請照上線教學貼上 Firestore 規則。":"資料載入失敗，請重新整理頁面。";render();
  });
  let threadUnsub=null,mineUnsub=null,authGen=0;
  B.onAuth(async u=>{
    const gen=++authGen; // 換帳號時，舊的那一輪跑到一半就停
    if(threadUnsub){threadUnsub();threadUnsub=null;}
    if(mineUnsub){mineUnsub();mineUnsub=null;}
    S.authUser=u;S.uid=u?u.uid:null;S.threads=[];S.mine=null;S.isOwner=false;S.canWrite=u?true:null;S.ready=true;S.profileReady=false;
    if(!u){
      // 沒登入或登出：清掉帳號的聯絡資料，只留位置；收藏改用這台裝置的清單
      S.me={name:"",phone:"",line:"",county:S.me.county||"",area:S.me.area||""};lsSet("jieliao.me",S.me);
      S.favs=guestFavs();
      if(S.chat)closeSheet("#chatSheet");
    }else{
      const uid=u.uid;
      S.isOwner=await B.isAdmin(uid);if(gen!==authGen)return;
      try{
        const p=await S.db.doc("users/"+uid).get();if(gen!==authGen)return;
        const d=p.exists?(p.data()||{}):{};
        ["name","phone","line"].forEach(k=>{S.me[k]=typeof d[k]==="string"?d[k]:"";});
        ["county","area"].forEach(k=>{if(typeof d[k]==="string"&&d[k])S.me[k]=d[k];});
        if(!S.me.name&&u.name)S.me.name=u.name;
        lsSet("jieliao.me",S.me);
        // 收藏：帳號裡的（舊→新存放）＋登入前在這台裝置收藏的
        const remote=Array.isArray(d.favs)?d.favs.filter(x=>typeof x==="string"):[];
        const guest=S.favs.filter(x=>remote.indexOf(x)<0);
        S.favs=guest.concat(remote.slice().reverse()).slice(0,300);
        if(guest.length)S.db.doc("users/"+uid).set({favs:B.arrayUnion(...guest.slice().reverse())},{merge:true}).catch(()=>{});
        lsSet("jieliao.favs",[]);S.profileReady=true;
      }catch(e){}
      try{
        threadUnsub=S.db.collection("chats").where("members","array-contains",uid).limit(500).onSnapshot(snap=>{
          S.threads=snap.docs.map(d=>Object.assign({id:d.id},d.data()));render();if(S.chat)markRead();
        },()=>{});
        // 我的刊登另外抓，不受首頁只載入最新幾筆影響
        mineUnsub=S.db.collection("listings").where("ownerId","==",uid).limit(100).onSnapshot(snap=>{
          S.mine=snap.docs.map(d=>Object.assign({id:d.id},d.data()));render();
        },()=>{});
      }catch(e){}
      if(document.querySelector("#loginSheet.open")){closeSheet("#loginSheet");toast("登入成功");}
      if(S._afterLogin){const f=S._afterLogin;S._afterLogin=null;setTimeout(f,50);}
    }
    if(S.view==="me")renderMe(true);
    render();
  });
})();
})();
</script>
